name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Build frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://bdgtilgnicexcxyzcjks.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: build-placeholder

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check (atendente virtual)
        run: deno check supabase/functions/clinic-assistant/index.ts
      - name: Tests (atendente virtual)
        run: deno test supabase/functions/_shared/clinic-assistant-core_test.ts
